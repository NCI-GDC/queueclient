[tox]
envlist = py36

[testenv]
passenv =
    RABBITMQ_*
setenv =
    NO_PROXY=localhost,rabbitmq
    no_proxy=localhost,rabbitmq
commands = pifpaf run rabbitmq -- python -m pytest -lv --junit-xml=.report/pytest.xml

deps =
    -rdev-requirements.txt

[testenv:publish]
changedir =
passenv =
  TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
