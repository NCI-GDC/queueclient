---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/artifacts/python-library.yaml

variables:
  BASE_CONTAINER_VERSION: 3.2.3
  LANGUAGE_VERSION: python3.10

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION: [python3.10, python3.11, python3.12, python3.13]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
  services:
    - name: docker:dind
      command: [--tls=false]
      alias: docker
  tags:
    - dind
