language: python

python:
    - "2.7"
    - "3.5"
    - "3.6"

addons:
  apt:
    packages:
    - rabbitmq-server

install:
    - pip install -r requirements.txt
    - pip install -r dev-requirements.txt
    - yes | python setup.py install

script: "python -m pytest -vvvs --junit-xml=.report/pytest.xml"
